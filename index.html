<!DOCTYPE HTML>
<html>
<head>
    <title>Sladká Pohádka - Stránka se připravuje</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f8f8; /* Světle šedé pozadí */
            color: #333; /* Tmavý text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Celá výška viewportu */
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 2em;
            background-color: #ffffff; /* Bílé pozadí obsahu */
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            margin: 20px;
        }
        h1 {
            color: #f56a6a; /* Akcentní barva */
            font-size: 2.5em;
            margin-bottom: 0.5em;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 1em;
        }
        .logo, .vizitka {
            margin: 2em auto;
            max-width: 100%;
            height: auto;
        }
        .logo img {
            max-width: 200px;
            height: auto;
        }
        .vizitka img {
            max-width: 300px; /* Nastavit dle potřeby */
            height: auto;
            border: 1px solid #eee;
            border-radius: 5px;
        }
        .contact-info {
            margin-top: 2em;
            padding-top: 1em;
            border-top: 1px solid #eee;
        }
        .contact-info p {
            font-size: 1.1em;
            color: #555;
        }
        .footer {
            margin-top: 3em;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="images/logo_pohadka_small.png" alt="Handmade Petra Logo"/>
        </div>
        <h1>Pracujeme na novém webu!</h1>
        <p>Děkujeme za vaši trpělivost. Usilovně pracujeme na vylepšení našich stránek a brzy vám přineseme spoustu novinek.</p>

        <div class="contact-info">
            <h2>Kontaktujte nás</h2>
            <div class="vizitka">
                <img src="images/vizitka.png" alt="Vizitka"/>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2026 Sladká Pohádka. Všechna práva vyhrazena.</p>
        </div>
    </div>
</body>
</html>
